<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercato — Lista de Compras</title>
<meta name="theme-color" content="#16a34a">
<meta name="description" content="Mercato — lista de compras simples, offline e instalável.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mercato">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f8f4;--card:#fff;--ink:#14211a;--mut:#667a6e;--line:#e1e9e2;--g:#16a34a;--gs:#e8f6ec;--red:#dc2626;--wb:#fef3c7;--wt:#92400e;--sh:0 1px 2px #0000000d,0 8px 24px #0000000a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--ink:#eaf3ec;--mut:#93a89a;--line:#263229;--gs:#1b2f22;--wb:#40300b;--wt:#fcd34d;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--ink:#eaf3ec;--mut:#93a89a;--line:#263229;--gs:#1b2f22;--wb:#40300b;--wt:#fcd34d;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 90px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#0f7a37);display:grid;place-items:center;color:#fff}
h1{font-size:24px;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{margin:0 0 4px;font-size:20px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s,background .15s;text-decoration:none}
.btn:active{transform:scale(.96)}
.pri{background:var(--g);border-color:var(--g);color:#fff}
.dan{color:var(--red)}
.ic{width:44px;padding:0;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.lc{cursor:pointer;animation:in .3s both;transition:transform .15s}
.lc:hover{transform:translateY(-2px)}
.nm{font-weight:600;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--gs);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--gs);border-radius:14px;padding:10px 8px}
.stat b{display:block;font-size:14px}
.stat span{font-size:11.5px;color:var(--mut)}
.add{display:flex;gap:8px;margin:14px 0 4px}
.in{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.in:focus{outline:2px solid var(--g);border-color:transparent}
textarea.in{padding:10px;min-height:110px;font:12px ui-monospace,Menlo,monospace}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:20px 4px 8px}
.it{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;animation:in .25s both}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:.2s}
.ck svg{opacity:0;transform:scale(.5);transition:.2s}
.done .ck{background:var(--g);border-color:var(--g)}
.done .ck svg{opacity:1;transform:none}
.done .nm{text-decoration:line-through;color:var(--mut)}
.done{background:var(--gs)}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--wb);color:var(--wt);white-space:nowrap}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
.nin{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:4px 6px;margin:0 0 4px -6px;border-radius:8px;min-height:34px}
.nin:focus,.qi:focus{outline:2px solid var(--g);background:var(--card)}
.done .nin{text-decoration:line-through;color:var(--mut)}
.fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qi{width:64px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 8px;font:inherit;font-size:16px;text-align:center}
.qi.pi{width:96px}
.subv{margin-left:auto;font-weight:700;font-size:14px}
.bg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--gs)}
.bg.over{background:var(--wb)}
.bi{width:120px}
.empty{text-align:center;padding:44px 20px}
.empty .logo{width:72px;height:72px;border-radius:24px;margin:0 auto 16px}
.empty .logo svg{width:34px;height:34px}
.empty p{color:var(--mut);margin:6px auto 20px;max-width:320px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fd .2s}
.sh{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s;max-height:92vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:24px}}
.lb{font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px;display:block}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14211a;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:30;animation:in .25s;max-width:90vw;box-shadow:0 8px 24px #0004}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const K='mercato:v1';
const NATIVE=location.protocol==='file:';
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const P={plus:'M12 5v14M5 12h14',tr:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',ed:'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z',ck:'M20 6L9 17l-5-5',bk:'M15 18l-6-6 6-6',dl:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3',cart:'M6 6h15l-1.5 9h-12zM6 6L5 3H2M9 20h.01M18 20h.01'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const R=n=>BRL.format(n);
const Q=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:3});
const fin=v=>v==null?'':String(v).replace('.',',');
const nn=v=>v===null||v===undefined||v===''||!isFinite(+v)||+v<0?null:+v;
const num=s=>{s=String(s==null?'':s).trim().replace(/\s/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)&&n>=0?n:NaN};
const clean=d=>({lists:(d&&Array.isArray(d.lists)?d.lists:[]).map(l=>({id:String(l.id||uid()),name:String(l.name||'Lista').slice(0,60),budget:nn(l.budget)||null,ack:!!l.ack,items:(Array.isArray(l.items)?l.items:[]).map(i=>({id:String(i.id||uid()),name:String(i.name||'Produto').slice(0,80),qty:nn(i.qty),price:nn(i.price),done:!!i.done}))}))});
let S={lists:[]},V={n:'home'},M=null,F=0,DP=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(V.n=='home'&&!M)render()});
window.addEventListener('appinstalled',()=>{DP=null;render();toast('Mercato instalado')});
try{S=clean(JSON.parse(localStorage.getItem(K)||'null'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const byId=id=>S.lists.find(l=>l.id==id);
const cur=()=>byId(V.id);
const item=id=>cur().items.find(i=>i.id==id);
const pr=i=>i.qty>0&&i.price!=null;
const sub=i=>i.qty*i.price;
function st(l){let t=0,b=0,p=0,d=0;l.items.forEach(i=>{if(i.done)d++;if(pr(i)){const s=sub(i);t+=s;i.done?b+=s:p+=s}});const n=l.items.length;return{n,d,t,b,p,pct:n?Math.round(d/n*100):0}}
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

const empty=(t,p,btn)=>`<div class="empty"><div class="logo">${ic('cart')}</div><h2>${t}</h2><p>${p}</p>${btn||''}</div>`;
const card=l=>{const s=st(l);return `<div class="card lc" data-act="open" data-id="${l.id}"><div class="row"><div class="sp"><div class="nm">${E(l.name)}</div><div class="mut">${s.n} ${s.n==1?'produto':'produtos'} · ${s.d} ${s.d==1?'comprado':'comprados'}</div></div><button class="btn ic" data-act="rn" data-id="${l.id}" aria-label="Renomear lista">${ic('ed')}</button><button class="btn ic dan" data-act="dl" data-id="${l.id}" aria-label="Excluir lista">${ic('tr')}</button></div><div class="bar"><i style="width:${s.pct}%"></i></div><div class="row" style="margin-top:10px"><span class="mut sp">${s.pct}% concluído</span><b>${R(s.t)}</b></div></div>`};
const home=()=>`<div class="top"><div class="brand"><span class="logo">${ic('cart')}</span>Mercato</div><div class="row">${!NATIVE?`<a class="btn" href="./downloads/mercato.apk" download aria-label="Baixar aplicativo Android">${ic('dl')}Baixar APK</a>`:''}${DP?`<button class="btn" data-act="inst">Instalar</button>`:''}<button class="btn ic" data-act="bk" aria-label="Backup">${ic('dl')}</button><button class="btn pri" data-act="newl">${ic('plus')}Nova lista</button></div></div>`+(S.lists.length?`<div class="grid">${S.lists.map(card).join('')}</div>`:empty('Crie sua primeira lista','Planeje as compras só com os nomes dos produtos. Quantidades e preços você preenche no mercado.',`<button class="btn pri" data-act="newl">${ic('plus')}Criar lista</button>`));
const row=i=>`<div class="it ${i.done?'done':''}"><button class="ck" data-act="tg" data-id="${i.id}" aria-label="Marcar como comprado">${ic('ck')}</button><div class="sp"><input class="nin" data-f="name" data-id="${i.id}" maxlength="80" enterkeyhint="done" aria-label="Nome" value="${E(i.name)}"><div class="fl"><input class="qi" data-f="qty" data-id="${i.id}" inputmode="decimal" enterkeyhint="done" placeholder="Qtd" aria-label="Quantidade" value="${fin(i.qty)}"><span class="mut">×</span><input class="qi pi" data-f="price" data-id="${i.id}" inputmode="decimal" enterkeyhint="done" placeholder="R$ 0,00" aria-label="Preço unitário" value="${fin(i.price)}"><span class="subv" id="s-${i.id}">${pr(i)?R(sub(i)):'<span class="tag">A definir</span>'}</span></div></div><button class="btn ic dan" data-act="dit" data-id="${i.id}" aria-label="Excluir produto">${ic('tr')}</button></div>`;
function bud(l,s){const bu=l.budget,ov=bu&&s.b>bu;return `<div class="bg${ov?' over':''}"><span class="mut" style="font-weight:600">Valor disponível</span><input class="qi bi" data-f="budget" inputmode="decimal" enterkeyhint="done" placeholder="R$ 0,00" aria-label="Valor disponível" value="${fin(bu)}">${bu?(ov?`<b style="color:var(--red)">Excedido: ${R(s.b-bu)}</b>`:`<b style="color:var(--g)">Restante: ${R(bu-s.b)}</b>`):'<span class="mut">Defina quanto pode gastar</span>'}</div>`}
function refresh(){const h=document.createElement('div');h.innerHTML=lv();const a=h.querySelector('#sm'),m=$('#sm');if(a&&m)m.innerHTML=a.innerHTML}
function chk(){const l=cur();if(!l||M||!l.budget)return;const b=st(l).b;if(b<l.budget){if(l.ack){l.ack=false;save()}return}
 if(!l.ack){l.ack=true;save();M={t:'bg'};try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}render()}}
const lv=()=>{const l=cur(),s=st(l),pe=l.items.filter(i=>!i.done),dn=l.items.filter(i=>i.done);
return `<div class="top"><button class="btn ic" data-act="home" aria-label="Voltar">${ic('bk')}</button><h1 class="sp">${E(l.name)}</h1><button class="btn ic" data-act="rn" data-id="${l.id}" aria-label="Renomear">${ic('ed')}</button></div>
<div class="card" id="sm"><div class="row"><b class="sp">Progresso</b><span class="mut">${s.d} de ${s.n} · ${s.pct}%</span></div><div class="bar" style="margin-top:8px"><i style="width:${s.pct}%"></i></div>
${bud(l,s)}<div class="stats"><div class="stat"><b>${R(s.t)}</b><span>Total precificado</span></div><div class="stat"><b>${R(s.b)}</b><span>No carrinho</span></div><div class="stat"><b>${R(s.p)}</b><span>Pendente</span></div></div></div>
<div class="add"><input class="in" id="add" placeholder="Adicionar produto…" enterkeyhint="done" autocomplete="off" maxlength="80"><button class="btn pri" data-act="add">${ic('plus')}Adicionar</button></div>`+
(l.items.length?`<div class="cols"><div><div class="sec">Pendentes · ${pe.length}</div>${pe.length?pe.map(row).join(''):'<p class="mut">Nenhum item pendente.</p>'}</div><div><div class="sec">No carrinho · ${dn.length}</div>${dn.length?dn.map(row).join(''):'<p class="mut">Marque itens como OK para movê-los para cá.</p>'}</div></div>`:empty('Lista vazia','Digite o nome de um produto acima e toque em Adicionar. Preço e quantidade ficam para depois.'));};

const sheet=h=>`<div class="ov"><div class="sh">${h}</div></div>`;
const er='<div class="err" id="er"></div>';
const modal=()=>{if(!M)return'';
if(M.t=='nm')return sheet(`<h2>${M.id?'Renomear lista':'Nova lista'}</h2><label class="lb">Nome da lista</label><input class="in" id="f1" data-enter maxlength="60" value="${E(M.v||'')}" placeholder="Ex.: Compras do mês">${er}<div class="row" style="margin-top:16px"><button class="btn sp" data-act="cx">Cancelar</button><button class="btn pri sp" data-act="sn">Salvar</button></div>`);
if(M.t=='cf')return sheet(`<h2>Excluir lista?</h2><p class="mut">“${E(byId(M.id).name)}” e todos os seus produtos serão removidos. Esta ação não pode ser desfeita.</p><div class="row" style="margin-top:16px"><button class="btn sp" data-act="cx">Cancelar</button><button class="btn pri sp" style="background:var(--red);border-color:var(--red)" data-act="cd">Excluir</button></div>`);
if(M.t=='it'){const i=item(M.id);return sheet(`<h2>Editar produto</h2><label class="lb">Nome</label><input class="in" id="f1" data-enter maxlength="80" value="${E(i.name)}"><div class="row" style="gap:12px;align-items:flex-end"><div class="sp"><label class="lb">Quantidade</label><input class="in" id="f2" data-enter inputmode="decimal" placeholder="Ex.: 2" value="${fin(i.qty)}"></div><div class="sp"><label class="lb">Preço unitário (R$)</label><input class="in" id="f3" data-enter inputmode="decimal" placeholder="Ex.: 25,90" value="${fin(i.price)}"></div></div><label class="row" style="margin-top:16px;cursor:pointer"><input type="checkbox" id="f4" ${i.done?'checked':''} style="width:22px;height:22px;accent-color:var(--g)">Já coloquei no carrinho</label>${er}<div class="row" style="margin-top:16px"><button class="btn ic dan" data-act="di" aria-label="Excluir produto">${ic('tr')}</button><button class="btn sp" data-act="cx">Cancelar</button><button class="btn pri sp" data-act="si">Salvar</button></div>`)}
if(M.t=='bg'){const l=cur(),b=st(l).b,ex=b-l.budget;return sheet(`<h2>Valor disponível atingido</h2><p class="mut">Seu carrinho está em <b>${R(b)}</b> de <b>${R(l.budget)}</b> disponíveis${ex>0?`, <b style="color:var(--red)">${R(ex)} acima</b> do valor`:''}.</p><p style="font-weight:600">Deseja continuar comprando?</p><div class="row" style="margin-top:16px"><button class="btn sp" data-act="upb">Ajustar valor</button><button class="btn pri sp" data-act="cx">Continuar</button></div>`)}
if(M.t=='bk')return sheet(`<h2>Backup</h2><p class="mut">Baixe o arquivo ou copie o texto para guardar suas listas. Para restaurar, cole um backup ou escolha um arquivo .json.</p><label class="lb">Exportar</label><textarea class="in" id="exp" readonly>${E(JSON.stringify({app:'mercato',version:1,lists:S.lists},null,1))}</textarea><div class="row" style="margin-top:8px"><button class="btn sp" data-act="dwn">Baixar arquivo</button><button class="btn sp" data-act="cp">Copiar</button></div><label class="lb">Importar</label><input type="file" id="fi" accept=".json,application/json" style="margin-bottom:8px;max-width:100%"><textarea class="in" id="imp" placeholder="Cole aqui o backup JSON"></textarea>${er}<div class="row" style="margin-top:12px"><button class="btn sp" data-act="cx">Fechar</button><button class="btn pri sp" data-act="imp">Importar</button></div>`);
return''};

function render(){if(V.n=='list'&&!cur())V={n:'home'};
$('#app').innerHTML=(V.n=='home'?home():lv())+modal();
if(M){const f=$(M.t=='it'?'#f2':'#f1');if(f){f.focus();if(f.select&&M.t!='it')f.select()}}else if(F){const a=$('#add');if(a)a.focus()}
F=0}
const showErr=m=>{const e=$('#er');if(e)e.textContent=m};

const A={
upb(){M=null;render();const x=$('.bi');if(x){x.focus();x.select()}},
inst(){if(DP){DP.prompt();DP.userChoice.finally(()=>{DP=null;render()})}},
dwn(){try{const b=new Blob([JSON.stringify({app:'mercato',version:1,lists:S.lists},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mercato-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup baixado')}catch(e){toast('Não foi possível baixar. Use Copiar.')}},
home(){V={n:'home'};window.scrollTo(0,0);render()},
open(d){V={n:'list',id:d.id};window.scrollTo(0,0);render()},
newl(){M={t:'nm'};render()},
rn(d){const l=byId(d.id);M={t:'nm',id:d.id,v:l?l.name:''};render()},
sn(){const v=$('#f1').value.trim();if(!v)return showErr('Informe um nome para a lista.');
 if(M.id)byId(M.id).name=v;else{const l={id:uid(),name:v,items:[]};S.lists.unshift(l);V={n:'list',id:l.id};F=1}
 save();M=null;render();toast('Lista salva')},
dl(d){M={t:'cf',id:d.id};render()},
cd(){S.lists=S.lists.filter(l=>l.id!=M.id);save();M=null;render();toast('Lista excluída')},
cx(){M=null;render()},
tg(d){const i=item(d.id);i.done=!i.done;save();render();chk()},
add(){const el=$('#add'),v=el.value.trim();if(!v){toast('Digite o nome do produto');el.focus();return}
 cur().items.push({id:uid(),name:v,qty:null,price:null,done:false});save();F=1;render();toast('“'+v+'” adicionado')},
ei(d){M={t:'it',id:d.id};render()},
si(){const n=$('#f1').value.trim(),q=num($('#f2').value),p=num($('#f3').value);
 if(!n)return showErr('O nome do produto não pode ficar vazio.');
 if(Number.isNaN(q))return showErr('Quantidade inválida. Use números, como 2 ou 1,5.');
 if(Number.isNaN(p))return showErr('Preço inválido. Use números, como 25,90.');
 const i=item(M.id);i.name=n;i.qty=q;i.price=p;i.done=$('#f4').checked;save();M=null;render();toast('Produto atualizado')},
dit(d){const l=cur();l.items=l.items.filter(i=>i.id!=d.id);save();render();toast('Produto excluído')},
di(){const l=cur();l.items=l.items.filter(i=>i.id!=M.id);save();M=null;render();toast('Produto excluído')},
bk(){M={t:'bk'};render()},
cp(){const t=$('#exp');t.focus();t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Backup copiado'),()=>{document.execCommand('copy');toast('Backup copiado')})}catch(e){try{document.execCommand('copy');toast('Backup copiado')}catch(x){toast('Selecione o texto e copie')}}},
imp(){let d;try{d=JSON.parse($('#imp').value)}catch(e){return showErr('JSON inválido. Verifique o backup colado.')}
 const c=clean(d);if(!c.lists.length)return showErr('Nenhuma lista encontrada nesse backup.');
 c.lists.forEach(l=>{const k=S.lists.findIndex(x=>x.id==l.id);k>=0?S.lists[k]=l:S.lists.push(l)});
 save();M=null;render();toast(c.lists.length+' lista(s) importada(s)')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');
 if(t&&A[t.dataset.act]&&!(e.target.closest('.sh')&&!t.closest('.sh')))A[t.dataset.act](t.dataset);
 else if(e.target.classList.contains('ov')){M=null;render()}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;
 if(e.target.id=='add'){e.preventDefault();A.add()}
 else if(e.target.dataset&&e.target.dataset.f){e.preventDefault();e.target.blur()}else if(e.target.hasAttribute&&e.target.hasAttribute('data-enter')){e.preventDefault();const b=document.querySelector('.sh [data-act="sn"],.sh [data-act="si"]');b&&b.click()}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.f)return;const l=cur();
 if(t.dataset.f=='budget'){if(!l)return;const v=num(t.value);if(Number.isNaN(v)){t.value=fin(l.budget);toast('Valor inválido. Use números, como 500 ou 350,90.');return}l.budget=v>0?v:null;l.ack=false;save();refresh();chk();return}
 const i=l&&l.items.find(x=>x.id==t.dataset.id);if(!i)return;const f=t.dataset.f;
 if(f=='name'){const v=t.value.trim();if(v)i.name=v;else t.value=i.name}
 else{const v=num(t.value);if(Number.isNaN(v)){t.value=fin(i[f]);toast('Valor inválido. Use números, como 2 ou 25,90.');return}i[f]=v;t.value=fin(v)}
 save();const s=$('#s-'+i.id);if(s)s.innerHTML=pr(i)?R(sub(i)):'<span class="tag">A definir</span>';
 refresh();chk()});
document.addEventListener('change',e=>{if(e.target.id=='fi'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#imp').value=r.result};r.readAsText(e.target.files[0])}});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
